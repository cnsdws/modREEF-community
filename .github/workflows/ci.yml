name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - production
      - "feature/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/verify-open-source-config.sh
      - name: Install pinned Gitleaks
        run: bash scripts/install-gitleaks.sh /tmp/modreef-tools/gitleaks
      - name: Audit public source snapshot
        env:
          GITLEAKS_BINARY: /tmp/modreef-tools/gitleaks
        run: bash scripts/audit-public-snapshot.sh HEAD
      - name: Audit dependency license metadata
        run: node scripts/audit-dependency-licenses.mjs
      - run: pnpm test:factory
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @modreef/mobile export:web

  production-images:
    name: Production container builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Cloud API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cloud
          push: false
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
