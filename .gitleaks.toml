title = "modREEF secret scanning"
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Public device product identifiers used for protocol interoperability"
targetRules = ["generic-api-key"]
regexes = [
  '''02039876751049deb404d1d89221ec4b''',
  '''1aa33c38ba9d4b78a9e7796705b2fad7''',
]

[[allowlists]]
description = "Explicitly fake local key used by the Tuya bridge test"
targetRules = ["generic-api-key"]
regexes = [
  '''0123456789abcdef''',
]
